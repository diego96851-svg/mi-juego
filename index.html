<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Atrapa la Moneda</title>
<style>
body{
  text-align:center;
  font-family:Arial;
}
#coin{
  position:absolute;
  width:80px;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>Puntos: <span id="score">0</span></h1>

<img id="coin" src="https://cdn-icons-png.flaticon.com/512/272/272525.png">

<script>
let score = 0;
const coin = document.getElementById("coin");

function mover(){
  coin.style.left = Math.random()*80 + "vw";
  coin.style.top = Math.random()*80 + "vh";
}

coin.onclick = function(){
  score++;
  document.getElementById("score").textContent = score;
  mover();
};

mover();
</script>

</body>
</html>
